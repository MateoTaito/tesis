        </text>
        <text id="Scenarios-text" font-family="ArialMT, Arial" font-size="14" font-weight="normal" fill="#6D7278">
            <tspan x="120.8671875" y="579">institutional-memory [1–15], audit-noise [0–0.5],</tspan>
            <tspan x="120.8671875" y="599">tax-rate, penalty-rate, actual-audit-rate,</tspan>
            <tspan x="120.8671875" y="619">learning-rate, initial-Risk-aversion,</tspan>
            <tspan x="120.8671875" y="639">tax-payer-audit-selection {random, income-level, strategic}</tspan>
        </text>
        <text id="Initialisation-patte" font-family="Arial-BoldMT, Arial" font-size="16" font-weight="bold" fill="#6D7278">
            <tspan x="7.5" y="459">Patrones de inicialización</tspan>
        </text>
        <text id="Init-patterns-text" font-family="ArialMT, Arial" font-size="12" font-weight="normal" fill="#6D7278">
            <tspan x="7.5" y="479">Contribuyentes: income ~ log-normal(16,7)</tspan>
            <tspan x="7.5" y="496">pct-income-report ~ U[0,1)</tspan>
            <tspan x="7.5" y="513">risk-aversion = valor inicial fijo</tspan>
            <tspan x="7.5" y="530">income-history = []</tspan>
        </text>
        <text id="Submodel-patterns" font-family="Arial-BoldMT, Arial" font-size="16" font-weight="bold" fill="#6D7278">
            <tspan x="242.5" y="459">Patrones de submodelos</tspan>
        </text>
        <text id="Submodel-patterns-text" font-family="ArialMT, Arial" font-size="12" font-weight="normal" fill="#6D7278">
            <tspan x="242.5" y="479">Orden por tick: (1) make-audit</tspan>
            <tspan x="242.5" y="496">(2) txp-adjust-risk-aversion</tspan>
            <tspan x="242.5" y="513">(3) tax-payers-adjust-pct-inc-rep</tspan>
            <tspan x="242.5" y="530">(4) guardar income-history / actualizar income</tspan>
        </text>
        <text id="Observation-patterns" font-family="Arial-BoldMT, Arial" font-size="16" font-weight="bold" fill="#6D7278">
            <tspan x="622.5" y="459">Patrones de observación</tspan>
        </text>
        <text id="Observation-patterns-text" font-family="ArialMT, Arial" font-size="12" font-weight="normal" fill="#6D7278">
            <tspan x="622.5" y="479">Registro de PIAR_ticks y RA_ticks</tspan>
            <tspan x="622.5" y="496">en cada tick (series temporales)</tspan>
            <tspan x="622.5" y="513">Detección de pseudo estado</tspan>
            <tspan x="622.5" y="530">estacionario (umbrales)</tspan>
        </text>
