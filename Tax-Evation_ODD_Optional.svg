        <text id="Purpose-text" font-family="ArialMT, Arial" font-size="16" font-weight="normal" fill="#6D7278">
            <tspan x="109.6601562" y="26">Simular evasión fiscal: contribuyentes deciden cuánto reportar; auditores con memoria institucional revisan períodos pasados</tspan>
        </text>
