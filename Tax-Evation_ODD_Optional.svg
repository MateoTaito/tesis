        <text id="Submodel-1" font-family="ArialMT, Arial" font-size="16" font-weight="normal" fill="#000000" fill-opacity="0.85">
            <tspan x="237" y="327">make-audit</tspan>
        </text>
        <text id="Submodel-1-desc" font-family="ArialMT, Arial" font-size="11" font-weight="normal" fill="#000000" fill-opacity="0.75">
            <tspan x="237" y="347">Auditoría con memoria institucional:</tspan>
            <tspan x="237" y="362">revisa hasta N periodos hacia atrás</tspan>
            <tspan x="237" y="377">evitando re-auditar periodos ya revisados</tspan>
        </text>
        <text id="Submodel-2" font-family="ArialMT, Arial" font-size="16" font-weight="normal" fill="#000000" fill-opacity="0.85">
            <tspan x="237" y="206">txp-adjust-risk-aversion</tspan>
        </text>
        <text id="Submodel-2-desc" font-family="ArialMT, Arial" font-size="11" font-weight="normal" fill="#000000" fill-opacity="0.75">
            <tspan x="237" y="226">Ajusta aversión al riesgo por</tspan>
            <tspan x="237" y="241">influencia vecinal (neighbors)</tspan>
            <tspan x="237" y="256">e historial de sanciones observadas</tspan>
        </text>
        <text id="Submodel-3" font-family="ArialMT, Arial" font-size="16" font-weight="normal" fill="#000000" fill-opacity="0.85">
            <tspan x="237" y="128">tax-payers-adjust-pct-inc-rep</tspan>
        </text>
        <text id="Submodel-3-desc" font-family="ArialMT, Arial" font-size="11" font-weight="normal" fill="#000000" fill-opacity="0.75">
            <tspan x="237" y="148">Ajusta pct-income-report según</tspan>
            <tspan x="237" y="163">auditoría, detección y risk-aversion</tspan>
            <tspan x="237" y="178">(regla multiplicativa)</tspan>
        </text>
        <text id="Submodel-4" font-family="ArialMT, Arial" font-size="16" font-weight="normal" fill="#000000" fill-opacity="0.85">
            <tspan x="373" y="128">auditors-adjust-pct-eff</tspan>
        </text>
        <text id="Submodel-4-desc" font-family="ArialMT, Arial" font-size="11" font-weight="normal" fill="#000000" fill-opacity="0.75">
            <tspan x="373" y="148">Ajusta eficiencia cada</tspan>
            <tspan x="373" y="163">100 auditorías acumuladas</tspan>
        </text>
